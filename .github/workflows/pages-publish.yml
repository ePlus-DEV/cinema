name: Publish GitHub Pages

# Only the staging workflow dispatches this after it PUSHES a changed
# gh-pages tree. A successful no-op stage must not create another deploy.
# This trusted workflow always runs from the default branch.
on:
  workflow_dispatch:
    inputs:
      preview_pr:
        description: 'PR number to notify after the Pages deployment succeeds (preview only)'
        required: false
        type: string
      preview_sha:
        description: 'Exact staged PR head SHA, used to reject stale notifications'
        required: false
        type: string

# Deployment token has Pages-only privileges. PR comments are posted by a
# separate non-environment job, only after a successful deploy.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: cinema-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout staged static website
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publication
          persist-credentials: false

      - name: Upload complete Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: publication
          # Re-runs otherwise create multiple artifacts named github-pages in
          # one run; deploy-pages refuses to pick one and fails permanently.
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub artifact indexing can lag behind upload finalization. Avoid
          # the "No artifacts named" race seen in publish run 42967595927.
          for attempt in 1 2 3 4 5 6 7 8; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[].name' | grep -Fxq "$ARTIFACT_NAME"; then
              echo "Pages artifact is indexed: $ARTIFACT_NAME"
              exit 0
            fi
            sleep 3
          done
          echo "Pages artifact not indexed after retries: $ARTIFACT_NAME" >&2
          exit 1

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}


  notify:
    name: Post PR preview link
    needs: deploy
    # Also notify already-open PRs with matching gh-pages markers after a
    # production deployment, so users don't need dummy PR commits.
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Use main source, not untrusted PR code. A successful deploy is a hard
      # dependency, and the script verifies current PR SHA and staged marker.
      - name: Checkout trusted notification helper
        uses: actions/checkout@v4
        with:
          ref: main
          path: automation
          persist-credentials: false

      - name: Post or update PR preview link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_PR: ${{ inputs.preview_pr }}
          PREVIEW_SHA: ${{ inputs.preview_sha }}
        run: bash automation/scripts/post-preview-link.sh
