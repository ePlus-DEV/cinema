name: Build and stage GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: write

# Serialize gh-pages writes; never interrupt a publishing write.
# Queue all distinct PR-close and main events, then skip stale/duplicate runs
# cheaply before installing dependencies.
concurrency:
  group: cinema-pages-stage
  cancel-in-progress: false
  queue: max

jobs:
  stage:
    # Never execute/build third-party fork code with write-capable deployment.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_ROOT_PATH: '/'
      PAGES_SITE_ORIGIN: 'https://cinema.eplus.dev'
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      # Off by default. Enable only after source/content rights and launch review.
      # PR preview paths remain noindex even if this repository variable is true.
      SEO_INDEXABLE: ${{ vars.CINEMA_SEO_INDEXABLE || 'false' }}
      # CORS proxy for the live MoMo showtimes page; override with the
      # PUBLIC_MOMO_CORS_PROXY repository variable if the proxy moves.
      PUBLIC_MOMO_CORS_PROXY: ${{ vars.PUBLIC_MOMO_CORS_PROXY || 'https://cors-eplus-bba6d8ad0ca6.herokuapp.com' }}
    steps:
      - name: Checkout website source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure production or PR preview
        id: config
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action || '' }}
        run: |
          set -euo pipefail
          ROOT_PATH="$PAGES_ROOT_PATH"
          if [[ ! "$ROOT_PATH" =~ ^/([a-zA-Z0-9_-]+/)*$ ]]; then
            echo "Invalid PAGES_ROOT_PATH: $ROOT_PATH" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid PR number" >&2
              exit 1
            fi
            BASE_PATH="${ROOT_PATH}previews/pr-${PR_NUMBER}/"
            if [[ "$PR_ACTION" == "closed" ]]; then
              KIND="delete-preview"
            else
              KIND="preview"
            fi
          else
            BASE_PATH="$ROOT_PATH"
            KIND="production"
          fi
          echo "PAGES_BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          echo "PAGES_DEPLOY_KIND=$KIND" >> "$GITHUB_ENV"
          echo "preview_url=${PAGES_SITE_ORIGIN}${BASE_PATH}" >> "$GITHUB_OUTPUT"
          echo "Deploy kind: $KIND | Base path: $BASE_PATH"

      - name: Skip superseded and already-staged events
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          should_run=true
          reason="new content"
          read_marker() {
            gh api "repos/${GITHUB_REPOSITORY}/contents/$1?ref=gh-pages" --jq '.content' 2>/dev/null | base64 --decode 2>/dev/null || true
          }
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            current_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            state="$(jq -r '.state' <<< "$current_pr")"
            actual_sha="$(jq -r '.head.sha' <<< "$current_pr")"
            if [[ "$PR_ACTION" == "closed" ]]; then
              if [[ "$state" == "open" ]]; then
                should_run=false
                reason="PR reopened after close event"
              fi
            elif [[ "$state" != "open" || "$actual_sha" != "$PR_HEAD_SHA" ]]; then
              should_run=false
              reason="PR closed or replaced by a newer commit"
            elif [[ "$(read_marker "previews/pr-${PR_NUMBER}/.eplus-preview-sha")" == "$PR_HEAD_SHA" ]]; then
              should_run=false
              reason="same PR commit already staged"
            fi
          else
            actual_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
              should_run=false
              reason="superseded main commit"
            elif [[ "$EVENT_NAME" == "push" && "$(read_marker '.eplus-production-sha')" == "$EXPECTED_SHA" ]]; then
              should_run=false
              reason="same main commit already staged"
            fi
          fi
          echo "run=$should_run" >> "$GITHUB_OUTPUT"
          echo "Stage gate: $should_run ($reason)"
          echo "Stage gate: $should_run ($reason)" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        if: steps.gate.outputs.run == 'true' && github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true' && github.event.action != 'closed'
        run: npm install --no-audit --no-fund

      - name: Build Astro site
        if: steps.gate.outputs.run == 'true' && github.event.action != 'closed'
        run: |
          npm run build
          node scripts/rewrite-links.mjs
          node scripts/smoke-test.mjs
          node scripts/seat-color-test.mjs
          node scripts/seatmap-ui-test.mjs
          node scripts/seat-center-zone-test.mjs
          node scripts/seo-audit.mjs
          node scripts/check-outbound-links.mjs
          node scripts/check-actions-dedup.mjs

      - name: Stage full site and preview into gh-pages
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: bash scripts/publish-pages.sh

      - name: Pages publishing summary
        if: steps.gate.outputs.run == 'true' && github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.config.outputs.preview_url }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          if [[ "$PR_ACTION" == "closed" ]]; then
            echo "Removed preview folder for PR #$PR_NUMBER. The default-branch Pages deployment updates the public site next." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### PR #$PR_NUMBER preview" >> "$GITHUB_STEP_SUMMARY"
            echo "Preview URL (published after the downstream Pages deploy completes): $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

