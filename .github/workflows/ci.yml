name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Astro preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate catalog refresher syntax
        run: |
          node --check scripts/sync-cinema-catalog.mjs
          npm run check:catalog
      - name: Build static website
        run: npm run build
      - name: Check generated routes, preview links and external navigation
        run: |
          node scripts/rewrite-links.mjs
          node scripts/smoke-test.mjs
          node scripts/seo-audit.mjs
          node scripts/check-outbound-links.mjs
      - name: Verify explicitly indexable build
        run: |
          SEO_INDEXABLE=true npm run build
          SEO_INDEXABLE=true node scripts/seo-audit.mjs
      - name: Prevent indexing on PR preview even with launch switch
        run: |
          PAGES_BASE_PATH=/previews/pr-999/ SEO_INDEXABLE=true npm run build
          PAGES_BASE_PATH=/previews/pr-999/ SEO_INDEXABLE=true node scripts/seo-audit.mjs
