name: Publish GitHub Pages

# Only the staging workflow dispatches this after it PUSHES a changed
# gh-pages tree. A successful no-op stage must not create another deploy.
# This trusted workflow always runs from the default branch.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cinema-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout staged static website
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publication
          persist-credentials: false

      - name: Upload complete Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: publication

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
